# .github/workflows/lint-course.yml
name: lint-course
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint:course
      - run: npm run build
